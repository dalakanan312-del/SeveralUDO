{% if page in ['rolls','illnesses','pregnancies','relationships'] %}<label>Sims<select name="living">{% for key,label in [('living','Living'),('dead','Deceased'),('all','Living and deceased')] %}<option value="{{key}}" {% if list_living==key %}selected{% endif %}>{{label}}</option>{% endfor %}</select></label>{% endif %}
{% if page=='sims' %}<label>Sort<select name="sort">{% for key,label in [('birth','Birth · oldest first'),('birth-newest','Birth · youngest first'),('name','Name')] %}<option value="{{key}}" {% if ui_query.get('sort','birth')==key %}selected{% endif %}>{{label}}</option>{% endfor %}</select></label>{% endif %}
{% if page=='automation' %}<label>Evidence<select name="review_quality"><option value="all">All findings</option><option value="confirmed" {% if review_filter=='confirmed' %}selected{% endif %}>Explicit detections</option><option value="suggestion" {% if review_filter=='suggestion' %}selected{% endif %}>Uncertain suggestions</option></select></label>{% endif %}
