{% if list_pages is defined and list_pages>1 %}<nav class="pager" aria-label="Record pages">
  {% if list_page>1 %}<a class="button" href="?living={{list_living|default("all")}}&sort={{ui_query.get("sort","")}}&review_quality={{review_filter|default("all")}}&list_page={{list_page-1}}{% if list_q %}&q={{list_q|urlencode}}{% endif %}{% if list_status %}&record_status={{list_status}}{% endif %}{% if page=='sims' %}&sim_branch={{sim_branch|urlencode}}{% endif %}">← Previous</a>{% endif %}
  <span>Page {{list_page}} of {{list_pages}}</span>
  {% if list_page<list_pages %}<a class="button" href="?living={{list_living|default("all")}}&sort={{ui_query.get("sort","")}}&review_quality={{review_filter|default("all")}}&list_page={{list_page+1}}{% if list_q %}&q={{list_q|urlencode}}{% endif %}{% if list_status %}&record_status={{list_status}}{% endif %}{% if page=='sims' %}&sim_branch={{sim_branch|urlencode}}{% endif %}">Next →</a>{% endif %}
</nav>{% endif %}
